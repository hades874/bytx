[project]
name = "bytx"
version = "0.1.0"
description = "Local Bangla and English YouTube and Facebook transcription and searchable knowledge store (faster-whisper + Ollama)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hasan Farabi", email = "h.farabi01@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["bangla", "bengali", "transcription", "speech-to-text", "whisper", "youtube", "facebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Bengali",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.21",
    "jiwer>=4.0.0",
    "numpy>=2.5.3",
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    # deno: the JavaScript runtime yt-dlp needs for YouTube, so users needn't install it.
    "yt-dlp[default,deno]>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/hades874/bytx"
Issues = "https://github.com/hades874/bytx/issues"

[project.scripts]
bytx = "bytx:main"

[project.optional-dependencies]
# CUDA libraries for NVIDIA GPUs (about 1.3 GB). Without them bytx runs on the CPU.
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.26.0.51; sys_platform == 'win32' or sys_platform == 'linux'",
]
# Maintainer only: converting a Whisper checkpoint (scripts/convert_model.py).
convert = [
    "torch>=2.14.0",
    "transformers>=4.23",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
# Without this, pytest's default collection walks the whole project tree,
# including any project-local caches (e.g. a uv cache under tools/), which
# hold unrelated third-party test files from cached wheels.
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures often need long inline literals (Bangla text, SQL, dataclass
# construction); readability there matters more than the 110-char wrap.
"tests/*" = ["E501"]
# Typer's API requires calling typer.Option()/typer.Argument() as argument
# defaults -- that's the documented pattern, not a mutable-default bug.
"src/bytx/cli.py" = ["B008"]
